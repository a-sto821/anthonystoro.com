name: Temporary final single favicon cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'single-favicon-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: single-favicon-source
      - name: Remove all competing favicon declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          browser_icon = '  <link rel="icon" href="/favicon-as-final-v2.png?v=20260820d" type="image/png" sizes="512x512">\n'
          touch_icon = '  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260820d" sizes="180x180">\n'

          for filename in ('index.html', 'case-study.html', 'case-study-shell.txt', '404.html'):
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'^[ \t]*<link[ \t]+rel="(?:icon|shortcut icon|apple-touch-icon)"[^\n]*\n', '', text, flags=re.MULTILINE)

              marker = '  <meta name="robots" content="noindex">\n' if filename == '404.html' else '  <meta name="theme-color" content="#151515">\n'
              if marker not in text:
                  raise SystemExit(f'Insertion point missing in {filename}')
              text = text.replace(marker, marker + browser_icon + touch_icon, 1)

              # Normalize tags that were previously pulled left by old cleanup scripts.
              text = re.sub(r'^<(?=(?:meta|link|style))', '  <', text, flags=re.MULTILINE)
              path.write_text(text)
          PY
      - name: Commit final deterministic favicon markup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html case-study.html case-study-shell.txt 404.html
          git commit -m 'Remove competing favicon declarations'
          git push origin HEAD:single-favicon-source
