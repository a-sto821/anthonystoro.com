name: Fix favicon and About crop

on:
  push:
    branches: [fix-favicon-about-photo]
    paths:
      - '.github/workflows/fix-favicon-about.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-favicon-about-photo
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<link rel="icon" href="/favicon.ico?v=20260815-2" type="image/x-icon">\n  <link rel="shortcut icon" href="/favicon.ico?v=20260815-2" type="image/x-icon">', '<link rel="icon" href="/favicon-20260815.svg" type="image/svg+xml">\n  <link rel="shortcut icon" href="/favicon-20260815.svg" type="image/svg+xml">')
          s = s.replace('<link rel="stylesheet" href="/css/tablet-header.css?v=1">', '<link rel="stylesheet" href="/css/tablet-header.css?v=1">\n  <link rel="stylesheet" href="/css/final-tweaks.css?v=1">')
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/fix-favicon-about.yml
          git config user.name "Project Beam"
          git config user.email "anthonystoro@icloud.com"
          git add index.html .github/workflows/fix-favicon-about.yml
          git commit -m "Use new favicon and About crop override [skip ci]"
          git push origin HEAD:fix-favicon-about-photo
