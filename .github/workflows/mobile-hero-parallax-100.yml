name: Temporary mobile hero parallax update

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'mobile-hero-parallax-100' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-hero-parallax-100
      - name: Increase mobile hero parallax and bust cache
        run: |
          sed -i 's/progress \* -60/progress * -100/' js/motion.js
          sed -i 's|/js/motion.js?v=3|/js/motion.js?v=4|' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motion.js index.html
          git commit -m 'Increase mobile hero parallax to 100px'
          git push origin HEAD:mobile-hero-parallax-100
