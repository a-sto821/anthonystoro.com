name: Temporary Figma case study image sync

on:
  push:
    branches: [figma-case-study-image-sync]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figma-case-study-image-sync
      - name: Download finalized Figma gallery renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/case-studies
          curl -L --fail --retry 3 -o assets/images/case-studies/carlingtech-desktop.png 'https://www.figma.com/api/mcp/asset/631fa9f9-8ca3-45c0-bbbd-dbd10da54dce.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/carlingtech-mobile.png 'https://www.figma.com/api/mcp/asset/2f3051c2-6ab6-4b85-86f7-6c0030cecd51.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/fuse-holder-selector-desktop.png 'https://www.figma.com/api/mcp/asset/8c072fcb-5eb1-4dd0-8526-c21a25c64190.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/fuse-holder-selector-mobile.png 'https://www.figma.com/api/mcp/asset/f9acf622-9dec-4c57-aa17-7e99cb8bdd5f.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/v-series-selector-desktop.png 'https://www.figma.com/api/mcp/asset/f736cab8-0c44-49f1-8afa-20f4c76fe212.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/v-series-selector-mobile.png 'https://www.figma.com/api/mcp/asset/041374f6-3077-4ee3-b71a-5ac7a8d06871.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/sp-campbell-desktop.png 'https://www.figma.com/api/mcp/asset/5a0f855e-a1f1-4af4-8653-8ffb8f3c2959.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/sp-campbell-mobile.png 'https://www.figma.com/api/mcp/asset/c94c5ad0-f2e7-418c-96ee-892a9af1274a.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/transportation-products-catalog-desktop.png 'https://www.figma.com/api/mcp/asset/b978ce02-8e48-4141-a13a-1caf00dc8356.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/transportation-products-catalog-mobile.png 'https://www.figma.com/api/mcp/asset/0f221573-6aff-4c85-af43-a846ebd6d929.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/conexpo-trade-show-desktop.png 'https://www.figma.com/api/mcp/asset/ea07019c-f6ec-4c7c-aa59-53554a39595a.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/conexpo-trade-show-mobile.png 'https://www.figma.com/api/mcp/asset/d08e82ec-7e0d-4532-90aa-537eaf29d63c.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/carling-china-capabilities-desktop.png 'https://www.figma.com/api/mcp/asset/846ccfc4-b754-4d1c-8ef5-2d79812879d5.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/carling-china-capabilities-mobile.png 'https://www.figma.com/api/mcp/asset/58078a81-c547-4d8f-ba62-6a26a4861a9e.png'
