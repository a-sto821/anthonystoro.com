          curl -L --fail --retry 3 -o assets/images/case-studies/arbor-meadows-desktop.png 'https://www.figma.com/api/mcp/asset/83b966f9-7d38-4680-a510-b970756a3e22.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/arbor-meadows-mobile.png 'https://www.figma.com/api/mcp/asset/6b4c264d-45b7-4707-97f1-460ecb38842b.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/little-stuess-book-desktop.png 'https://www.figma.com/api/mcp/asset/59459460-fa8d-4b36-b23e-ffdf291f479a.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/little-stuess-book-mobile.png 'https://www.figma.com/api/mcp/asset/124d5745-c3a3-4200-84bd-15b6206d4562.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/logo-brand-identity-desktop.png 'https://www.figma.com/api/mcp/asset/18f58c55-dae7-4fb3-8637-5c96f265fc5c.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/logo-brand-identity-mobile.png 'https://www.figma.com/api/mcp/asset/f209f042-f2a0-4fbb-8cad-8cccf080c27f.png'
      - name: Commit gallery renders
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/case-studies
          git commit -m 'Add finalized Figma case study gallery renders'
          git push origin HEAD:figma-case-study-image-sync
