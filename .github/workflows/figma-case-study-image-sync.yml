          curl -L --fail --retry 3 -o assets/images/case-studies/window-switch-product-overview-desktop.png 'https://www.figma.com/api/mcp/asset/e6e46eca-f68b-4dc0-9c65-5a4b2a63fb63.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/window-switch-product-overview-mobile.png 'https://www.figma.com/api/mcp/asset/273212c3-60df-4961-b37b-c9c5f74139da.png'
          curl -L --fail --retry 3 -o assets/images/case-studies/cole-hersee-100-year-desktop.png 'https://www.figma.com/api/mcp/asset/d1b39086-374a-4d2c-b091-1658736a045f.png'
