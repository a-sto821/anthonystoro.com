name: Temporary favicon HTML cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'finalize-favicon-browser-fallbacks' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize-favicon-browser-fallbacks
      - name: Remove legacy favicon references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('index.html','case-study.html','case-study-shell.txt'):
              path=Path(filename)
              lines=path.read_text().splitlines()
              lines=[line for line in lines if 'favicon-as-final.svg' not in line and 'favicon-20260815.svg' not in line and 'favicon-20260820.svg' not in line]
              lines=[('  ' + line.lstrip()) if line.lstrip().startswith('<link rel="preconnect"') else line for line in lines]
              path.write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html case-study.html case-study-shell.txt
          git commit -m 'Remove legacy favicon references'
          git push origin HEAD:finalize-favicon-browser-fallbacks

# trigger
