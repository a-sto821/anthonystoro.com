name: Temporary favicon cache version bump

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  bump:
    if: github.head_ref == 'transparent-favicon-corners' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transparent-favicon-corners
      - name: Bump favicon version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('index.html','case-study.html','case-study-shell.txt','404.html'):
              p=Path(filename)
              text=p.read_text().replace('favicon-as-final-v2.png?v=20260820d','favicon-as-final-v2.png?v=20260820e')
              p.write_text(text)
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html case-study.html case-study-shell.txt 404.html
          git commit -m 'Bump favicon cache version'
          git push origin HEAD:transparent-favicon-corners
