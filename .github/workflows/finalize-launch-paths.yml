name: Finalize production asset paths

on:
  push:
    branches:
      - phase-1-cloudflare-build

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-launch]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-cloudflare-build
          fetch-depth: 0

      - name: Verify localized assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/graphics/hero-figma.svg
            assets/graphics/hero-background-layer.svg
            assets/graphics/hero-mobile-layer.svg
            assets/images/digital/carlingtech.png
            assets/images/digital/fuse-holder-selector.png
            assets/images/digital/v-series-selector.png
            assets/images/digital/sp-campbell.png
            assets/images/multimedia/fuse-holder-product-overview.png
            assets/images/multimedia/carling-china-capabilities.png
            assets/images/multimedia/window-switch-product-overview.png
            assets/images/multimedia/cole-hersee-100-year.png
            assets/images/brand-print/littelfuse-transportation-catalog.jpg
            assets/images/brand-print/carling-100-years.jpg
            assets/images/brand-print/conexpo-trade-show.png
            assets/images/brand-print/arbor-meadows.jpg
            assets/images/brand-print/little-stuess-book.jpg
            assets/images/brand-print/logo-designs.jpg
            assets/images/about/anthony-portrait.png
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Switch site to local production assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'js/main.js': {
              'https://www.figma.com/api/mcp/asset/5e40bbaf-3521-4926-9e9c-8e03f9498a33.svg': '/assets/graphics/hero-figma.svg',
              'https://www.figma.com/api/mcp/asset/ae50787e-8a67-41cd-9dc2-663dff78f2ef.png': '/assets/images/digital/carlingtech.png',
              'https://www.figma.com/api/mcp/asset/8199d4ff-a741-4b88-9602-6cae490f84f6.png': '/assets/images/digital/fuse-holder-selector.png',
              'https://www.figma.com/api/mcp/asset/49d556b4-38c8-4192-ba56-7731493c1c72.png': '/assets/images/digital/v-series-selector.png',
              'https://www.figma.com/api/mcp/asset/e2440d14-6d50-49a4-9a15-800b8bd8ceb5.png': '/assets/images/digital/sp-campbell.png',
              'https://www.figma.com/api/mcp/asset/1b146291-7363-44bc-9328-97df9f42b917.png': '/assets/images/multimedia/fuse-holder-product-overview.png',
              'https://www.figma.com/api/mcp/asset/7475f594-ee68-476e-aaf2-0d4b5b059608.png': '/assets/images/multimedia/carling-china-capabilities.png',
              'https://www.figma.com/api/mcp/asset/21e3f84f-6f0c-4c43-b60b-37cdfff94b96.png': '/assets/images/multimedia/window-switch-product-overview.png',
              'https://www.figma.com/api/mcp/asset/47af09d1-7f27-40d9-9552-600fcf280644.png': '/assets/images/multimedia/cole-hersee-100-year.png',
              'https://www.figma.com/api/mcp/asset/b8e3ed09-9760-4c5d-a991-f5bd53057946.png': '/assets/images/brand-print/conexpo-trade-show.png',
              'https://www.figma.com/api/mcp/asset/3792481b-4127-4eba-88f6-d897f94a5b82.png': '/assets/images/about/anthony-portrait.png',
            },
            'css/figma-sync.css': {
              'https://www.figma.com/api/mcp/asset/c4b4abac-fcea-4e3e-b056-dd82a228fa87.svg': '/assets/graphics/hero-background-layer.svg',
              'https://www.figma.com/api/mcp/asset/e182f0c3-c0c2-4aec-814f-7099b95be12f.svg': '/assets/graphics/hero-mobile-layer.svg',
            },
            'index.html': {
              'https://anthonystoro.com/wp-content/uploads/2024/03/16x9-print-cvp-catalog.jpg': '/assets/images/brand-print/littelfuse-transportation-catalog.jpg',
              'https://anthonystoro.com/wp-content/uploads/2021/08/carling-100years.jpg': '/assets/images/brand-print/carling-100-years.jpg',
              'https://www.figma.com/api/mcp/asset/afdd65f8-e828-4dd8-9c99-7574607ea011.png': '/assets/images/brand-print/conexpo-trade-show.png',
              'https://anthonystoro.com/wp-content/uploads/2021/08/arbor-meadows.jpg': '/assets/images/brand-print/arbor-meadows.jpg',
              'https://anthonystoro.com/wp-content/uploads/2019/11/little-stuess-book.jpg': '/assets/images/brand-print/little-stuess-book.jpg',
              'https://anthonystoro.com/wp-content/uploads/2019/11/wildthings.jpg': '/assets/images/brand-print/logo-designs.jpg',
            },
          }

          for file_name, mapping in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Expected launch source missing from {file_name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          if grep -R -nE 'www\.figma\.com/api/mcp/asset|anthonystoro\.com/wp-content' index.html js css; then
            echo 'Temporary/existing-site asset dependency remains in production code.'
            exit 1
          fi

      - name: Remove one-time launch workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localize-launch-assets.yml .github/workflows/finalize-launch-paths.yml
          git config user.name 'Project Beam'
          git config user.email 'anthonystoro@icloud.com'
          git add index.html js/main.js css/figma-sync.css .github/workflows
          git commit -m 'Finalize self-contained production website [skip ci]'
          git push origin HEAD:phase-1-cloudflare-build
