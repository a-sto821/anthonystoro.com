name: Temporary single favicon source cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'single-favicon-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: single-favicon-source

      - name: Use one explicit browser favicon source everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          browser_icon = '  <link rel="icon" href="/favicon-as-final-v2.png?v=20260820d" type="image/png" sizes="512x512">\n'
          touch_icon = '  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260820d" sizes="180x180">\n'

          for filename in ('index.html', 'case-study.html', 'case-study-shell.txt', '404.html'):
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'^\s*<link\s+rel="(?:icon|shortcut icon|apple-touch-icon)"[^>]*>\s*\n?', '', text, flags=re.MULTILINE)

              if filename == '404.html':
                  marker = '  <meta name="robots" content="noindex">\n'
              else:
                  marker = '  <meta name="theme-color" content="#151515">\n'

              if marker not in text:
                  raise SystemExit(f'Insertion point missing in {filename}')
              text = text.replace(marker, marker + browser_icon + touch_icon, 1)
              path.write_text(text)
          PY

      - name: Commit deterministic favicon references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html case-study.html case-study-shell.txt 404.html
          git commit -m 'Use one explicit favicon source everywhere'
          git push origin HEAD:single-favicon-source
