name: Temporary mobile hero Figma transfer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  transfer:
    if: github.head_ref == 'mobile-hero-179-14-exact' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-hero-179-14-exact
      - name: Download exact Figma mobile hero SVG
        run: |
          curl -L --fail --retry 3 -o assets/graphics/hero-mobile-179-14.svg 'https://www.figma.com/api/mcp/asset/663e5fed-b14f-40fc-a62f-e36342287265.svg'
      - name: Commit mobile hero asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/graphics/hero-mobile-179-14.svg
          git commit -m 'Sync mobile hero graphic to Figma 179:14'
          git push origin HEAD:mobile-hero-179-14-exact
