name: Fix contact status helper

on:
  push:
    branches:
      - simplify-contact-form

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-contact-status]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-contact-form
          fetch-depth: 0
      - name: Restore helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/main.js')
          text = p.read_text()
          needle = "  const form = document.querySelector('#contact-form');\n  const status = document.querySelector('#form-status');\n"
          replacement = needle + "\n  const setStatus = (message, type = '') => {\n    if (!status) return;\n    status.textContent = message;\n    status.classList.toggle('is-error', type === 'error');\n    status.classList.toggle('is-success', type === 'success');\n  };\n"
          if needle not in text:
              raise SystemExit('Contact form anchor not found')
          text = text.replace(needle, replacement, 1)
          p.write_text(text)
          PY
          node --check js/main.js
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-contact-status.yml
          git config user.name 'Project Beam'
          git config user.email 'anthonystoro@icloud.com'
          git add -A
          git commit -m 'Restore contact form status helper [skip ci]'
          git push origin HEAD:simplify-contact-form
