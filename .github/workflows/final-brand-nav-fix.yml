name: Temporary final favicon and nav fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'final-favicon-nav-arrows' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-favicon-nav-arrows
      - name: Apply favicon and case study navigation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          logo = Path('assets/logos/anthony-storo-logo.svg').read_text()
          old_root = '<svg width="86" height="62" viewBox="0 0 86 62" fill="none" xmlns="http://www.w3.org/2000/svg">'
          new_root = '<svg width="86" height="86" viewBox="0 0 86 86" fill="none" xmlns="http://www.w3.org/2000/svg">'
          if old_root not in logo:
              raise SystemExit('Current logo root did not match expected production SVG')
          favicon = logo.replace(old_root, new_root, 1)
          favicon = favicon.replace('>\n<path', '>\n<rect width="86" height="86" rx="14" fill="#151515"/>\n<g transform="translate(0 12)">\n<path', 1)
          favicon = favicon.replace('</svg>', '</g>\n</svg>', 1)
          Path('favicon-20260820.svg').write_text(favicon)

          for filename in ('index.html', 'case-study.html'):
              path = Path(filename)
              text = path.read_text().replace('/favicon-20260815.svg', '/favicon-20260820.svg?v=1')
              icon_line = '  <link rel="icon" href="/favicon-20260820.svg?v=1" type="image/svg+xml">\n'
              shortcut_line = '  <link rel="shortcut icon" href="/favicon-20260820.svg?v=1" type="image/svg+xml">\n'
              if shortcut_line not in text:
                  text = text.replace(icon_line, icon_line + shortcut_line, 1)
              if filename == 'case-study.html':
                  text = text.replace('/css/case-study.css?v=3', '/css/case-study.css?v=4')
              path.write_text(text)

          css_path = Path('css/case-study.css')
          css = css_path.read_text()
          old_link = '''.case-nav-link {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
          }
          '''
          new_link = '''.case-nav-link {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
          }

          .case-nav-link.prev {
            padding-left: 18px;
          }

          .case-nav-link.next {
            padding-right: 18px;
          }

          .case-nav-link.prev::before,
          .case-nav-link.next::after {
            content: "";
            position: absolute;
            top: calc(50% + 6px);
            width: 8px;
            height: 8px;
            border: solid #262626;
            border-width: 0 2px 2px 0;
          }

          .case-nav-link.prev::before {
            left: 1px;
            transform: translateY(-50%) rotate(135deg);
          }

          .case-nav-link.next::after {
            right: 1px;
            transform: translateY(-50%) rotate(-45deg);
          }
          '''
          if old_link not in css:
              raise SystemExit('Desktop case-nav-link block not found')
          css = css.replace(old_link, new_link, 1)

          css += '''

          /* Final cross-browser mobile chevrons: override legacy text glyphs. */
          @media (max-width: 720px) {
            .case-nav-link.prev::before,
            .case-nav-link.next::after {
              content: "";
              top: 50%;
              width: 8px;
              height: 8px;
              border: solid #262626;
              border-width: 0 2px 2px 0;
              font: inherit;
            }

            .case-nav-link.prev::before {
              left: 1px;
              transform: translateY(-50%) rotate(135deg);
            }

            .case-nav-link.next::after {
              right: 1px;
              transform: translateY(-50%) rotate(-45deg);
            }
          }
          '''
          css_path.write_text(css)
          PY

      - name: Commit final polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon-20260820.svg index.html case-study.html css/case-study.css
          git commit -m 'Fix favicon and case study navigation arrows'
          git push origin HEAD:final-favicon-nav-arrows